<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>市中家教 — 坐得近一点</title>
<meta name="description" content="一对一线下上门家教。坐得近一点，学得好一点。">
<style>

:root{
  --bg:#FFFFFF; --fg:#1A1010; --accent:#D62828; --d:0;
  --card:color-mix(in srgb, var(--bg) 72%, white);
  --line:color-mix(in srgb, var(--fg) 13%, transparent);
  --muted:color-mix(in srgb, var(--fg) 60%, transparent);
  --red:#D62828;
  --sans:system-ui, -apple-system, 'Segoe UI', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif;
  --serif:'Songti SC', 'Noto Serif SC', 'Source Han Serif SC', 'STSong', SimSun, Georgia, serif;
  --mono:ui-monospace, 'Cascadia Code', 'SF Mono', Consolas, 'Noto Sans Mono CJK SC', monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);line-height:1.6;overflow-x:hidden;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font-family:inherit}
.wrap{max-width:1120px;margin:0 auto;padding:0 24px}
section{position:relative}
::selection{background:color-mix(in srgb, var(--accent) 35%, transparent)}

/* ---------- NAV ---------- */
.nav{position:fixed;top:0;left:0;right:0;z-index:50;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  background:color-mix(in srgb, var(--bg) 82%, transparent);border-bottom:1px solid var(--line)}
.nav .wrap{display:flex;align-items:center;justify-content:space-between;height:68px}
.logo{display:flex;gap:10px;align-items:center;font-weight:800;font-size:20px;letter-spacing:-.02em}
.logo svg{width:30px;height:30px;flex:none}
.logo .seal{fill:var(--accent);transition:fill .6s}
.brand{white-space:nowrap}
.brand .gone{color:#FF2A2A;text-shadow:0 0 12px rgba(255,42,42,.85);animation:logoFlick .16s steps(2) 2}
@keyframes logoFlick{50%{opacity:.35}}
.nav ul{display:flex;gap:30px;list-style:none;font-size:15px;font-weight:500;color:var(--muted)}
.nav ul a:hover{color:var(--fg)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--accent);color:#fff;font-weight:700;font-size:15px;
  padding:12px 22px;border-radius:12px;border:0;cursor:pointer;transition:transform .15s, box-shadow .25s;
  box-shadow:0 12px 26px -14px var(--accent)}
.btn:hover{transform:translateY(-1px)}
.btn.ghost{background:transparent;color:var(--fg);box-shadow:none;border:1.5px solid var(--line)}
.btn:focus-visible,#lang:focus-visible,#sound:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
@media (max-width:820px){.nav ul{display:none}}

/* ---------- HERO ---------- */
.hero{padding:144px 0 74px}
.hero .wrap{display:grid;grid-template-columns:1.05fr .95fr;gap:56px;align-items:center}
.pill{display:inline-flex;gap:8px;align-items:center;font-size:13px;font-weight:600;padding:6px 14px 6px 6px;border-radius:999px;
  background:var(--card);border:1px solid var(--line)}
.pill b{background:var(--accent);color:#fff;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:700}
h1{font-size:clamp(38px,5.6vw,62px);line-height:1.12;letter-spacing:-.025em;font-weight:800;margin:20px 0 18px}
h1 em{font-style:normal;color:var(--accent);position:relative;white-space:nowrap}
h1 em::after{content:"";position:absolute;left:-3%;right:-3%;bottom:.04em;height:.24em;border-radius:5px;
  background:color-mix(in srgb, var(--accent) 20%, transparent);transform:rotate(-.7deg);z-index:-1}
.lead{font-size:18px;color:var(--muted);max-width:560px}
.ctas{display:flex;gap:12px;margin-top:30px;flex-wrap:wrap}
.tiny{font-size:13px;color:var(--muted);margin-top:16px}
.tiny button{background:none;border:0;font:inherit;color:var(--accent);font-weight:700;cursor:pointer;
  text-decoration:underline;text-underline-offset:3px;padding:0}
@media (max-width:900px){.hero .wrap{grid-template-columns:1fr}.hero{padding-top:118px}}

/* scene: desk lamp, book, sticky note, phone */
.scene{position:relative;aspect-ratio:1/1.04;border-radius:28px;overflow:hidden;
  background:linear-gradient(158deg,#FFFFFF,#FFEDED 46%,#FFDCDC);
  box-shadow:inset 0 0 0 1px rgba(160,20,20,.08), 0 40px 70px -46px rgba(120,10,10,.35)}
.scene .glow{position:absolute;left:-6%;top:-8%;width:78%;aspect-ratio:1;pointer-events:none;
  background:radial-gradient(circle, rgba(255,120,120,.85), rgba(255,120,120,0) 62%);animation:breathe 7s ease-in-out infinite}
@keyframes breathe{50%{opacity:.62;transform:scale(.94)}}
.scene .desk{position:absolute;left:0;right:0;bottom:0;height:25%;z-index:1;
  background:linear-gradient(#A81C1C,#6E0A0A);box-shadow:inset 0 10px 16px rgba(60,0,0,.25)}
.scene .lamp{position:absolute;left:1%;bottom:23%;width:47%;z-index:2}
.scene .book{position:absolute;left:11%;bottom:5%;width:36%;z-index:3;transform:rotate(-7deg)}
.scene .note{position:absolute;right:5%;top:6%;width:36%;z-index:5;background:#FFFFFF;color:#A81414;
  font-family:var(--serif);font-size:13px;line-height:1.55;padding:14px 13px 12px;border-radius:2px;transform:rotate(3.6deg);
  box-shadow:0 14px 26px -16px rgba(120,20,20,.4), inset 0 0 0 1px rgba(214,40,40,.18)}
.scene .note b{display:block;font-size:12px;color:#D62828;letter-spacing:.08em;margin-bottom:6px;font-family:var(--sans)}
.scene .note::before{content:"";position:absolute;top:-7px;left:50%;width:28px;height:11px;border-radius:2px;
  transform:translateX(-50%);background:rgba(214,40,40,.32);box-shadow:0 1px 2px rgba(0,0,0,.15)}
.appcard{position:absolute;right:4%;bottom:4%;width:57%;z-index:6;background:#fff;border-radius:18px;padding:16px 18px 14px;
  color:#2A1010;font-size:13px;box-shadow:0 26px 54px -26px rgba(90,10,10,.4)}
.appcard h4{display:flex;justify-content:space-between;align-items:center;font-size:12px;letter-spacing:.06em;
  color:#A81414;font-weight:700;margin-bottom:10px;text-transform:uppercase}
.appcard h4 i{width:7px;height:7px;border-radius:50%;background:#D62828;box-shadow:0 0 0 3px rgba(214,40,40,.18);font-style:normal}
.appcard .row{display:flex;justify-content:space-between;padding:7px 0;border-top:1px solid #FBDCDC}
.appcard .row:first-of-type{border-top:0}
.appcard .row span:last-child{font-weight:700;font-variant-numeric:tabular-nums}

.logos{padding:6px 0 72px;text-align:center}
.logos p{font-size:13px;font-weight:600;color:var(--muted);letter-spacing:.08em}
.row2{display:flex;justify-content:center;gap:44px;flex-wrap:wrap;margin-top:20px;font-weight:800;font-size:19px;
  opacity:.4;letter-spacing:-.01em}

/* ---------- GENERIC ---------- */
.kicker{font-size:13px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
h2{font-size:clamp(28px,4vw,44px);letter-spacing:-.025em;line-height:1.16;font-weight:800;margin:10px 0 14px}
.sec{padding:104px 0}
.center{text-align:center}
.center .lead{margin:0 auto}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:52px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;margin-top:52px}
@media (max-width:900px){.grid3,.grid4{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:28px}
.card h3{font-size:19px;letter-spacing:-.01em;margin:16px 0 8px}
.card p{color:var(--muted)}
.ico{width:46px;height:46px;border-radius:13px;display:grid;place-items:center;
  background:color-mix(in srgb, var(--accent) 15%, transparent);font-size:21px}
.split{display:grid;grid-template-columns:1fr 1fr;gap:56px;align-items:center}
@media (max-width:900px){.split{grid-template-columns:1fr;gap:36px}}

/* ---------- 错题本 ---------- */
.worksheet{position:relative;max-width:840px;margin:52px auto 0;text-align:left;background:var(--card);
  border:1px solid var(--line);border-radius:20px;padding:36px 32px 30px}
.worksheet::before{content:"";position:absolute;inset:0;border-radius:20px;pointer-events:none;opacity:.5;
  background:repeating-linear-gradient(180deg, transparent 0 33px, color-mix(in srgb, var(--fg) 5%, transparent) 33px 34px)}
.stamp{position:absolute;right:30px;top:-14px;border:2.5px solid var(--red);color:var(--red);border-radius:9px;
  padding:5px 15px;font-family:var(--serif);font-size:18px;font-weight:700;transform:rotate(6deg);opacity:.86;
  letter-spacing:.16em;background:color-mix(in srgb, var(--bg) 70%, transparent)}
.mk{position:relative;display:flex;gap:14px;align-items:baseline;padding:15px 0;border-top:1px dashed var(--line)}
.mk:first-of-type{border-top:0}
.mk .no{font-family:var(--mono);font-size:11px;color:var(--muted);flex:none;padding-top:4px;letter-spacing:.04em}
.mk .qt{flex:1;font-size:16px;line-height:1.55}
.mk .ans{flex:none;font-family:var(--serif);font-size:16px;color:var(--red);opacity:.92}
.mk .x{flex:none;color:var(--red);font-weight:800;font-size:18px;line-height:1}
.worksheet .foot{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-top:22px;flex-wrap:wrap}
.worksheet .foot small{font-family:var(--serif);color:var(--muted);font-size:14px}
.analysis{display:none;margin-top:18px;padding:16px 18px;border-radius:12px;font-family:var(--serif);font-size:17px;
  background:color-mix(in srgb, var(--red) 8%, transparent);border:1px solid color-mix(in srgb, var(--red) 22%, transparent);
  color:color-mix(in srgb, var(--fg) 82%, var(--red))}
.analysis.on{display:block}

/* ---------- 一天的课表 ---------- */
.day{display:grid;border-left:2px solid var(--line);margin-left:8px}
.slot{position:relative;padding:0 0 26px 28px}
.slot::before{content:"";position:absolute;left:-7px;top:7px;width:12px;height:12px;border-radius:50%;
  background:var(--accent);box-shadow:0 0 0 4px var(--bg)}
.slot b{font-variant-numeric:tabular-nums;font-size:13px;color:var(--accent);letter-spacing:.04em}
.slot p{font-size:16px;font-weight:600;margin-top:1px}
.slot.late{opacity:.42}
.slot.late::before{background:#555}
.slot.late b{color:var(--muted)}
.report{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:26px}
.report h4{font-size:14px;letter-spacing:.06em;color:var(--muted);margin-bottom:16px;text-transform:uppercase}
.report small{font-size:13px;color:var(--muted);display:block}
.bar{height:9px;border-radius:99px;background:color-mix(in srgb, var(--fg) 9%, transparent);margin:7px 0 15px;overflow:hidden}
.bar span{display:block;height:100%;border-radius:99px;background:var(--accent);transition:width 1.1s ease}
.bar.rev span{background:color-mix(in srgb, var(--red) 70%, var(--accent))}

/* ---------- STEPS ---------- */
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:26px;margin-top:52px}
.step{border-top:2px solid var(--line);padding-top:20px;text-align:left}
.step .n{font-weight:800;font-size:42px;line-height:1;color:var(--accent);letter-spacing:-.04em}
.step h3{font-size:19px;margin:8px 0 6px}
.step p{color:var(--muted);font-size:15px}
@media (max-width:900px){.steps{grid-template-columns:1fr}}

/* ---------- TESTIMONIALS ---------- */
.quote{display:flex;flex-direction:column;gap:18px;text-align:left}
.stars{color:#D62828;letter-spacing:2px}
.who{display:flex;gap:12px;align-items:center;margin-top:auto}
.av{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:14px;color:#fff;flex:none;
  background:var(--accent);font-family:var(--serif)}
.who small{display:block;color:var(--muted);font-size:13px}
.av.wrong{background:#111 !important;position:relative;overflow:hidden}
.av.wrong::before,.av.wrong::after{content:"";position:absolute;top:15px;width:7px;height:9px;border-radius:50%;background:#fff}
.av.wrong::before{left:11px}.av.wrong::after{right:11px}
.updated{font-size:11px;color:var(--muted);font-style:italic;font-family:var(--serif)}

/* ---------- STATS ---------- */
.stats{display:grid;grid-template-columns:repeat(4,1fr);margin-top:52px;border:1px solid var(--line);border-radius:20px;overflow:hidden}
.stat{padding:32px 24px;border-right:1px solid var(--line);text-align:left}
.stat:last-child{border-right:0}
.stat .v{font-size:34px;font-weight:800;letter-spacing:-.04em;font-variant-numeric:tabular-nums;white-space:nowrap}
.stat p{color:var(--muted);font-size:13px;margin-top:4px}
.aside{margin-top:24px;font-size:15px;color:var(--muted);text-align:center}
@media (max-width:900px){.stats{grid-template-columns:1fr 1fr}.stat{border-bottom:1px solid var(--line)}}

/* ---------- 学情看板 / CCTV ---------- */
.cctv{position:relative;max-width:940px;margin:48px auto 0;aspect-ratio:16/9;border-radius:16px;overflow:hidden;background:#111;
  box-shadow:0 34px 70px -34px rgba(0,0,0,.65);border:1px solid var(--line)}
.cctv svg{width:100%;height:100%;display:block;filter:grayscale(1) contrast(1.12) brightness(.92);animation:flick 6s infinite steps(1)}
@keyframes flick{0%,100%{opacity:1}46%{opacity:.88}47%{opacity:1}74%{opacity:.93}}
.cctv .hud{position:absolute;inset:0;pointer-events:none;font-family:var(--mono);font-size:13px;color:#e9e9e9;
  padding:15px 20px;display:flex;flex-direction:column;justify-content:space-between;text-shadow:0 0 4px #000;
  background:repeating-linear-gradient(0deg, rgba(0,0,0,.24) 0 1px, transparent 1px 3px)}
.hud .top,.hud .bot{display:flex;justify-content:space-between;gap:16px}
.rec::before{content:"● ";color:#ff2b2b;animation:blink 1.2s infinite steps(1)}
@keyframes blink{50%{opacity:0}}
.motion{color:#ff4d4d;opacity:0;transition:opacity .35s}
.static{position:absolute;inset:0;opacity:0;pointer-events:none;background:#777;mix-blend-mode:hard-light}
.cap{margin-top:16px;font-size:15px;color:var(--muted)}
.hud .focus{color:#FFB3B3}

/* ---------- PRICING ---------- */
.prices{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:52px;align-items:stretch;text-align:left}
.price{display:flex;flex-direction:column}
.price .amt{font-size:44px;font-weight:800;letter-spacing:-.04em;margin:10px 0 2px;font-variant-numeric:tabular-nums}
.price .amt small{font-size:15px;font-weight:600;color:var(--muted)}
.price ul{list-style:none;margin:18px 0 26px;display:grid;gap:10px;font-size:15px}
.price li::before{content:"✓  ";color:var(--accent);font-weight:800}
.price .btn{margin-top:auto;justify-content:center}
.price.forever{background:#1A0303;color:#F0C9C9;border-color:#4A0A0A;transform:rotate(-.8deg)}
.price.forever p{color:#C9A2A2}
.price.forever li::before{content:"✕  ";color:#E01B1B}
.price.forever .amt{font-family:var(--serif);font-weight:400}
.price.forever .btn{background:#8C0A0A;box-shadow:0 0 30px -8px #E01B1B}
@media (max-width:900px){.prices{grid-template-columns:1fr}}

/* ---------- BLOG ---------- */
.post{display:flex;flex-direction:column;gap:10px;text-align:left}
.thumb{aspect-ratio:16/10;border-radius:12px;margin:-8px -8px 10px}
.post .meta{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}
.post h3{margin:0;font-size:19px;line-height:1.35}
.post p{font-size:15px}

/* ---------- TEAM ---------- */
.member{text-align:center}
.member .av{width:92px;height:92px;font-size:32px;margin:0 auto 14px;background:color-mix(in srgb, var(--accent) 78%, #000)}
.member .av.wrong{background:#111}
.member .av.wrong::before,.member .av.wrong::after{top:32px;width:12px;height:16px}
.member .av.wrong::before{left:25px}.member .av.wrong::after{right:25px}
.member b{display:block;font-size:17px}
.member small{color:var(--muted)}

/* ---------- FAQ ---------- */
.faq{max-width:760px;margin:52px auto 0;display:grid;gap:12px;text-align:left}
details{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px 24px}
summary{cursor:pointer;font-weight:700;font-size:17px;list-style:none;display:flex;justify-content:space-between;gap:20px}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";font-size:22px;line-height:1;color:var(--accent)}
details[open] summary::after{content:"−"}
details p{margin-top:12px;color:var(--muted);font-family:var(--serif);font-size:19px;line-height:1.55}
.jit span{display:inline-block;white-space:pre}

/* ---------- CONTACT ---------- */
.contact form{max-width:560px;margin:46px auto 0;display:grid;gap:14px;text-align:left}
.contact label{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.contact input,.contact textarea{width:100%;margin-top:6px;background:transparent;border:1px solid var(--line);border-radius:10px;
  padding:13px 15px;color:var(--fg);font-family:var(--serif);font-size:18px}
.contact textarea{min-height:104px;resize:vertical}
.contact .btn{justify-self:start;margin-top:4px}
.formmsg{font-family:var(--serif);font-size:21px;color:var(--red);min-height:32px}

/* ---------- LATE STAGE ---------- */
.serif{font-family:var(--serif);font-weight:400;letter-spacing:0}
.glitch{position:relative;display:inline-block}
.glitch::before,.glitch::after{content:attr(data-text);position:absolute;inset:0;pointer-events:none}
.glitch::before{color:#FF1A1A;mix-blend-mode:screen;animation:g1 2.6s infinite steps(1)}
.glitch::after{color:#FFFFFF;mix-blend-mode:screen;animation:g2 3.2s infinite steps(1);opacity:.55}
@keyframes g1{0%,92%,100%{transform:none;clip-path:inset(0 0 100% 0)}93%{transform:translate(-4px,1px);clip-path:inset(20% 0 50% 0)}96%{transform:translate(3px,-2px);clip-path:inset(60% 0 10% 0)}}
@keyframes g2{0%,88%,100%{transform:none;clip-path:inset(0 0 100% 0)}89%{transform:translate(4px,0);clip-path:inset(10% 0 70% 0)}94%{transform:translate(-3px,2px);clip-path:inset(45% 0 30% 0)}}

/* system log */
.log{height:320vh}
.log .stick{position:sticky;top:0;height:100vh;height:100dvh;display:grid;place-items:center;padding:0 24px;overflow:hidden}
.term{width:min(860px,100%);font-family:var(--mono);font-size:clamp(12px,1.55vw,16px);color:#F0C9C9;line-height:1.8;min-height:62vh}
.term .l{opacity:0;white-space:pre-wrap;transition:opacity .25s}
.term .l.on{opacity:1}
.term .l.warn{color:#FFB3B3}
.term .l.red{color:#FF2A2A}
.term .l.big{color:#FF2A2A;font-size:clamp(28px,5vw,54px);line-height:1.2;margin-top:14px;font-weight:700}
.cursor{display:inline-block;width:.6em;height:1.1em;background:#F0C9C9;vertical-align:-3px;animation:blink 1s infinite steps(1)}

/* eyes */
.eyes{height:260vh}
.eyes .stick{position:sticky;top:0;height:100vh;height:100dvh;overflow:hidden;display:grid;place-items:center}
.letsit{position:absolute;inset:-10%;font-family:var(--serif);font-size:22px;line-height:1.25;color:#6E0A0A;opacity:0;
  word-break:break-all;user-select:none;pointer-events:none;transform:rotate(-4deg)}
.eye{position:absolute;width:var(--w);aspect-ratio:2/1;transform:translate(-50%,-50%) rotate(var(--r));
  clip-path:ellipse(50% calc(var(--o,0) * 50%) at 50% 50%);
  background:radial-gradient(ellipse at 50% 50%,#FFE6E6 30%,#C99A9A 70%,#5A3030);
  filter:drop-shadow(0 0 10px rgba(0,0,0,.9))}
.eye i{position:absolute;left:50%;top:50%;width:46%;aspect-ratio:1;border-radius:50%;
  background:radial-gradient(circle,#000 0 30%,#5B0C06 34%,#2A0503 62%,#000 72%);
  transform:translate(calc(-50% + var(--x,0px)),calc(-50% + var(--y,0px)))}
.eyetext{position:relative;z-index:3;text-align:center;font-family:var(--serif);color:#F2D6D6;padding:0 24px}
.eyetext p{font-size:clamp(26px,5vw,56px);line-height:1.16;opacity:0;transition:opacity 1.2s;text-shadow:0 0 30px #000,0 0 8px #000}
.eyetext p.on{opacity:1}
.eyetext p.red{color:#E01B1B}
.end{height:240vh}
.end .stick{position:sticky;top:0;height:100vh;height:100dvh;display:grid;place-items:center;overflow:hidden}
.face{position:fixed;inset:0;z-index:40;pointer-events:none;display:none;place-items:center;overflow:hidden;opacity:0;filter:blur(3px)}
.face.on{display:grid}
.face img{display:block;width:min(72vw,420px);height:auto;transform:scale(.8)}
.endtext{position:absolute;bottom:12vh;left:0;right:0;text-align:center;font-family:var(--serif);
  font-size:clamp(21px,3.4vw,36px);color:#A88A8A;padding:0 24px}
.inside{font-family:var(--serif);font-size:clamp(34px,6.5vw,80px);color:#E01B1B;text-align:center;line-height:1.05;
  position:absolute;inset:0;display:grid;place-items:center;opacity:0;transition:opacity 2s;pointer-events:none;
  text-shadow:0 0 40px #6E0000;padding:0 24px}
